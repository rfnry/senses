<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Companion</title>
  </head>
  <body>
    <button id="start">Talk, with the camera on</button>
    <button id="screen" hidden>Share screen</button>
    <button id="camera" hidden>Use camera</button>
    <ul id="captions"></ul>
    <script type="module">
      import { connect } from '/client/index.js'

      const captions = document.getElementById('captions')
      const screen = document.getElementById('screen')
      const camera = document.getElementById('camera')
      const show = (who, text) => captions.append(Object.assign(document.createElement('li'), { textContent: `${who}: ${text}` }))

      document.getElementById('start').onclick = async () => {
        const senses = await connect({ url: `ws://${location.host}/senses`, transport: 'websocket', camera: { fps: 1, width: 1280 } })
        screen.onclick = () => senses.shareScreen().catch(() => show('line', 'screen not shared'))
        camera.onclick = () => senses.useCamera()
        senses.subscribe((event) => {
          if (event.kind === 'heard' && event.final) show(event.speaker.name, event.text)
          if (event.kind === 'looked') show('mind', 'looked')
          if (event.kind === 'said') show('companion', event.heard)
          if (event.kind === 'status') show('line', event.status)
          if (event.kind === 'video') {
            show('line', event.source === null ? 'no video' : `sending the ${event.source}`)
            screen.hidden = event.source === 'screen'
            camera.hidden = event.source === 'camera'
          }
        })
        screen.hidden = false
      }
    </script>
  </body>
</html>

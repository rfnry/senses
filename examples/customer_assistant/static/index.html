<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acme Home support</title>
  </head>
  <body>
    <button id="call">Call support</button>
    <button id="hang-up" hidden>Hang up</button>
    <ul id="captions"></ul>
    <script type="module">
      import { connect } from '/client/index.js'

      const call = document.getElementById('call')
      const hangUp = document.getElementById('hang-up')
      const captions = document.getElementById('captions')
      const show = (who, text) => captions.append(Object.assign(document.createElement('li'), { textContent: `${who}: ${text}` }))

      call.onclick = async () => {
        const senses = await connect({ url: `ws://${location.host}/senses`, transport: 'websocket' })
        hangUp.onclick = () => senses.close()
        senses.subscribe((event) => {
          if (event.kind === 'heard' && event.final) show(event.speaker.name, event.text)
          if (event.kind === 'said' && event.heard) show('support', event.interrupted ? `${event.heard} (cut off)` : event.heard)
          if (event.kind === 'status') [call.hidden, hangUp.hidden] = [event.status === 'open', event.status !== 'open']
        })
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Camera look</title>
  </head>
  <body>
    <button id="start">Start the camera</button>
    <form id="ask"><input id="question" placeholder="What do you see?" /><button>Ask</button></form>
    <p id="answer"></p>
    <script type="module">
      import { connect } from '/client/index.js'

      document.getElementById('start').onclick = () =>
        connect({ url: `ws://${location.host}/senses`, transport: 'websocket', microphone: false, camera: { fps: 1 } })

      document.getElementById('ask').onsubmit = async (event) => {
        event.preventDefault()
        const text = document.getElementById('question').value
        const response = await fetch('/ask', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }) })
        document.getElementById('answer').textContent = (await response.json()).answer ?? 'start the camera first'
      }
    </script>
  </body>
</html>

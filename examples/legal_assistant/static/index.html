<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acme firm screen</title>
  </head>
  <body>
    <button id="share">Share a screen</button>
    <button id="stop" hidden>Stop sharing</button>
    <p id="status">Not sharing.</p>
    <form id="ask"><input id="question" size="60" placeholder="Where is the indemnity clause?" /><button>Ask</button></form>
    <p id="reply"></p>
    <script type="module">
      import { connect } from '/client/index.js'

      const share = document.getElementById('share')
      const stop = document.getElementById('stop')
      const status = document.getElementById('status')

      share.onclick = async () => {
        const camera = { source: 'screen', width: 1280 }
        const senses = await connect({ url: `ws://${location.host}/senses`, transport: 'websocket', microphone: false, camera })
        stop.onclick = () => senses.close()
        senses.subscribe((event) => {
          if (event.kind === 'video' && event.source === null) senses.close()
          if (event.kind === 'looked') status.textContent = 'The reviewer looked at your screen.'
          if (event.kind === 'status') {
            [share.hidden, stop.hidden] = [event.status === 'open', event.status !== 'open']
            status.textContent = event.status === 'open' ? 'Sharing your screen.' : 'Not sharing.'
          }
        })
      }

      document.getElementById('ask').onsubmit = async (event) => {
        event.preventDefault()
        const question = document.getElementById('question').value
        const headers = { 'content-type': 'application/json', 'X-Tenant': 'firm-acme' }
        const response = await fetch('/ask', { method: 'POST', headers, body: JSON.stringify({ question }) })
        const body = await response.json()
        document.getElementById('reply').textContent = body.reply ?? body.detail
      }
    </script>
  </body>
</html>

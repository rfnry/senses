<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acme firm screen</title>
  </head>
  <body>
    <button id="share">Share a screen</button>
    <button id="stop" hidden>Stop sharing</button>
    <p id="status">Not sharing.</p>
    <script type="module">
      import { connect } from '/client/index.js'

      const share = document.getElementById('share')
      const stop = document.getElementById('stop')
      const status = document.getElementById('status')

      share.onclick = async () => {
        const camera = { source: 'screen', width: 1280 }
        const senses = await connect({ url: `ws://${location.host}/senses`, transport: 'websocket', microphone: false, camera })
        stop.onclick = () => senses.close()
        senses.subscribe((event) => {
          if (event.kind === 'video' && event.source === null) senses.close()
          if (event.kind === 'looked') status.textContent = 'The reviewer looked at your screen.'
          if (event.kind === 'status') {
            [share.hidden, stop.hidden] = [event.status === 'open', event.status !== 'open']
            status.textContent = event.status === 'open' ? 'Sharing your screen.' : 'Not sharing.'
          }
        })
      }
    </script>
  </body>
</html>

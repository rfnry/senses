<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acme Books</title>
  </head>
  <body>
    <button id="start">Share your screen and talk</button>
    <button id="stop" hidden>Stop</button>
    <ul id="captions"></ul>
    <script type="module">
      import { connect } from '/client/index.js'

      const start = document.getElementById('start')
      const stop = document.getElementById('stop')
      const captions = document.getElementById('captions')
      const show = (who, text) => captions.append(Object.assign(document.createElement('li'), { textContent: `${who}: ${text}` }))

      start.onclick = async () => {
        const camera = { source: 'screen', width: 1280 }
        const senses = await connect({ url: `ws://${location.host}/senses`, transport: 'websocket', camera })
        stop.onclick = () => senses.close()
        senses.subscribe((event) => {
          if (event.kind === 'heard' && event.final) show(event.speaker.name, event.text)
          if (event.kind === 'looked') show('bookkeeper', 'looked at your screen')
          if (event.kind === 'said' && event.heard) show('bookkeeper', event.heard)
          if (event.kind === 'video' && event.source === null) show('line', 'the screen is no longer shared')
          if (event.kind === 'status') [start.hidden, stop.hidden] = [event.status === 'open', event.status !== 'open']
        })
      }
    </script>
  </body>
</html>

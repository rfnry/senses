<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme Plastics maintenance</title>
  </head>
  <body>
    <select id="plant">
      <option value="plant-reno">Acme Plastics Reno</option>
      <option value="plant-monterrey">Acme Plastics Monterrey</option>
    </select>
    <button id="start">Start the camera</button>
    <button id="talk" hidden style="user-select: none; touch-action: none">Hold to talk</button>
    <ul id="captions"></ul>
    <script type="module">
      import { connect } from '/client/index.js'

      const talk = document.getElementById('talk')
      const captions = document.getElementById('captions')
      const show = (who, text) => captions.append(Object.assign(document.createElement('li'), { textContent: `${who}: ${text}` }))

      document.getElementById('start').onclick = async () => {
        const plant = document.getElementById('plant').value
        const camera = { facing: 'environment', width: 1280 }
        const senses = await connect({ url: `ws://${location.host}/senses?plant=${plant}`, transport: 'websocket', camera })
        senses.mute()
        let held = false
        talk.onpointerdown = () => {
          held = true
          senses.unmute()
        }
        talk.onpointerup = () => {
          held = false
          setTimeout(() => held || senses.mute(), 4000)
        }
        senses.subscribe((event) => {
          if (event.kind === 'turn_ended' && !held) senses.mute()
          if (event.kind === 'heard' && event.final) show(event.speaker.name, event.text)
          if (event.kind === 'looked') show('maintenance', 'looked at the camera')
          if (event.kind === 'said' && event.heard) show('maintenance', event.heard)
          if (event.kind === 'status') talk.hidden = event.status !== 'open'
        })
      }
    </script>
  </body>
</html>

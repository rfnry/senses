<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme Plastics maintenance</title>
  </head>
  <body>
    <button id="start">Start the camera</button>
    <button id="stop" hidden>Stop</button>
    <ul id="captions"></ul>
    <script type="module">
      import { connect } from '/client/index.js'

      const start = document.getElementById('start')
      const stop = document.getElementById('stop')
      const captions = document.getElementById('captions')
      const show = (who, text) => captions.append(Object.assign(document.createElement('li'), { textContent: `${who}: ${text}` }))

      start.onclick = async () => {
        const camera = { facing: 'environment', width: 1280 }
        const senses = await connect({ url: `ws://${location.host}/senses`, transport: 'websocket', camera })
        stop.onclick = () => senses.close()
        senses.subscribe((event) => {
          if (event.kind === 'heard' && event.final) show(event.speaker.name, event.text)
          if (event.kind === 'looked') show('maintenance', 'looked at the camera')
          if (event.kind === 'said' && event.heard) show('maintenance', event.heard)
          if (event.kind === 'status') [start.hidden, stop.hidden] = [event.status === 'open', event.status !== 'open']
        })
      }
    </script>
  </body>
</html>

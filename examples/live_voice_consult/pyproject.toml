[project]
name = "live_voice_consult"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "rfnry-senses",
    "rfnry-engine",
    "anthropic",
    "google-genai",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.uv.sources]
rfnry-senses = { path = "../../packages/python", editable = true }
rfnry-engine = { path = "../../../engine/packages/python", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["client", "harness", "providers"]
